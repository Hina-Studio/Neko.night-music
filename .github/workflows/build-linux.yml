name: build-linux

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ patchelf \
            libcurl4-openssl-dev libssl-dev \
            libgl1 libegl1 libfontconfig1 libxkbcommon-x11-0 libdbus-1-3

      - name: Build C++ core
        run: bash build.sh

      - name: Smoke test core
        run: |
          python -c "import sys; sys.path.insert(0, 'app'); import ncm_core; assert ncm_core.Client; blob = ncm_core.encrypt_secret('pw', 'linux-smoke'); assert ncm_core.decrypt_secret('pw', blob) == 'linux-smoke'; print('core OK')"

      - name: Package standalone
        run: bash tools/package_linux.sh

      - name: Smoke test app
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 15 dist_linux/entry.dist/NekoNightMusic
          test $? -eq 124

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: dist_installer/Neko.night-Music-Linux-*.tar.gz

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist_installer/Neko.night-Music-Linux-*.tar.gz --clobber
